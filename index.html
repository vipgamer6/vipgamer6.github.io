    <style>

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', 'Tajawal', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            overflow-x: hidden;
            color: #fff;
        }

        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0);
            animation: ripple-effect 0.6s ease-out;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 600px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
            animation: fadeInDown 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(131, 56, 236, 0.2);
        }

        .lang-btn i {
            font-size: 1rem;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            background: rgba(255, 0, 110, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 0, 110, 0.2);
            border-radius: 50px;
            color: #ff006e;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .like-btn:hover {
            background: rgba(255, 0, 110, 0.2);
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 0, 110, 0.3);
        }

        .like-btn.liked {
            background: rgba(255, 0, 110, 0.25);
            border-color: rgba(255, 0, 110, 0.5);

        }

        .like-btn.liked i {

            color: #ff2d6e;
        }

        @keyframes like-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes heart-burst {
            0% { transform: scale(1); }
            30% { transform: scale(1.5); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .like-btn i {
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .profile {

            opacity: 0;
        }

        .profile-img-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 1.5rem;
        }

        .profile-img-wrapper::before {
            content: '';

            inset: -5px;
            border-radius: 50%;

        }

        .profile-img-wrapper::after {

            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #ff006e;
            border-right-color: #8338ec;

        @keyframes gradient-rotate {

        .footer {

        @keyframes heartbeat {

        @keyframes fadeInDown {

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #ff006e, #8338ec);

        }

        @media (max-width: 480px) {
            .container { padding: 2rem 1rem; }
            .profile h1 { font-size: 1.8rem; }
            .profile-img-wrapper { width: 130px; height: 130px; }
            .link-card { padding: 1rem 1.2rem; }
            .link-icon { width: 48px; height: 48px; font-size: 1.4rem; }
            .roblox svg { width: 28px; height: 28px; }
            .top-bar { gap: 0.5rem; }
            .lang-btn, .like-btn { padding: 0.5rem 1rem; font-size: 0.8rem; }
            .stats { gap: 1.2rem; }
        }

        .typing-text::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAAaw05Scx3VwIQ5EF1ljc_dr0F42scUMo",
            authDomain: "vipgamer6-github-io.firebaseapp.com",
            databaseURL: "https://vipgamer6-github-io-default-rtdb.firebaseio.com",
            projectId: "vipgamer6-github-io",
            storageBucket: "vipgamer6-github-io.appspot.com",
            messagingSenderId: "452311425102",
            appId: "1:452311425102:web:ebbaeeb043091e8d03231f"
        };

        let database = null;
        let visitsRef = null;
        let likesRef = null;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            database = firebase.database();
            visitsRef = database.ref('stats/visits');
            likesRef = database.ref('stats/likes');
        } catch(e) {
            console.log("Firebase Init error: ", e);
        }

        let currentVisits = 1;
        let currentLikes = 0;

        const LS_USER_LIKED_KEY = 'vipg6_user_liked';
        let userLiked = localStorage.getItem(LS_USER_LIKED_KEY) === 'true';

        function handleVisits() {
            if (visitsRef) {
                visitsRef.transaction((count) => {
                    return (count || 0) + 1;
                });

                visitsRef.on('value', (snapshot) => {
                    currentVisits = snapshot.val() || 1;
                    animateCounter('visits', currentVisits);
                });
            } else {
                animateCounter('visits', 1);
            }
        }

        function handleLikes() {
            if (likesRef) {
                likesRef.on('value', (snapshot) => {
                    currentLikes = snapshot.val() || 0;
                    animateCounter('likes', currentLikes);
                    document.getElementById('likeCount').textContent = formatNumber(currentLikes);
                });
            } else {
                animateCounter('likes', 0);
            }
            updateLikeButtonState();
        }

        function toggleLike() {
            if (userLiked) {
                if (likesRef) {
                    likesRef.transaction((count) => {
                        return Math.max(0, (count || 0) - 1);
                    });
                } else {
                    currentLikes = Math.max(0, currentLikes - 1);
                    animateCounter('likes', currentLikes);
                    document.getElementById('likeCount').textContent = formatNumber(currentLikes);
                }
                userLiked = false;
                localStorage.setItem(LS_USER_LIKED_KEY, 'false');
            } else {
                if (likesRef) {
                    likesRef.transaction((count) => {
                        return (count || 0) + 1;
                    });
                } else {
                    currentLikes += 1;
                    animateCounter('likes', currentLikes);
                    document.getElementById('likeCount').textContent = formatNumber(currentLikes);
                }
                userLiked = true;
                localStorage.setItem(LS_USER_LIKED_KEY, 'true');
            }
            updateLikeButtonState();
        }

        function updateLikeButtonState() {
            const likeBtn = document.getElementById('likeBtn');
            const likeIcon = document.getElementById('likeIcon');

            if (userLiked) {
                likeBtn.classList.add('liked');
                likeIcon.classList.remove('far');
                likeIcon.classList.add('fas');
            } else {
                likeBtn.classList.remove('liked');
                likeIcon.classList.remove('fas');
                likeIcon.classList.add('far');
            }
        }

        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = 0, mouseY = 0;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                this.color = Math.random() > 0.5 ? '#ff006e' : '#8338ec';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 150) {
                    const force = (150 - distance) / 150;
                    this.x -= dx * force * 0.02;
                    this.y -= dy * force * 0.02;
                }

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < 80; i++) {
            particles.push(new Particle());
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(131, 56, 236, ${0.15 * (1 - distance / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            connectParticles();
            requestAnimationFrame(animate);
        }
        animate();

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            const glow = document.getElementById('cursorGlow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        document.addEventListener('click', (e) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = e.clientX - 25 + 'px';
            ripple.style.top = e.clientY - 25 + 'px';
            ripple.style.width = '50px';
            ripple.style.height = '50px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });

        function animateCounter(elementId, target) {
            const element = document.getElementById(elementId);
            element.classList.remove('loading');

            const duration = 1200;
            const start = 0;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(start + (target - start) * easeOut);

                element.textContent = formatNumber(current);

                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = formatNumber(target);
                }
            }
            requestAnimationFrame(update);
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M+';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K+';
            }
            return num.toString();
        }

                ttTitle: 'تيك توك',

                dcTitle: 'ديسكورد',
                dcDesc: 'انضم لمجتمعي',
                rbTitle: 'روبلوكس',
                rbDesc: 'بروفايلي على روبلوكس',
                footerText: 'صُنع بـ <i class="fas fa-heart"></i> 2026 | جميع الحقوق محفوظة',
                typingTexts: ['مبدع محتوى', 'صانع محتوى', 'يوتيوبر', 'ستريمر', 'مؤثر']
            },
            en: {
                langText: 'العربية',
                visitsLabel: 'Visits',
                likesLabel: 'Likes',
                channelsTitle: 'My Channels',
                ytTitle: 'YouTube',
                ytDesc: 'My Official Channel',
                ttTitle: 'TikTok',
                ttDesc: 'My Short Content',
                tgTitle: 'Telegram',
                tgDesc: 'My Telegram Channel',
                dcTitle: 'Discord',
                dcDesc: 'Join My Community',

                rbDesc: 'My Roblox Profile',
                footerText: 'Made with <i class="fas fa-heart"></i> 2026 | All Rights Reserved',
                typingTexts: ['Content Creator', 'YouTuber', 'Streamer', 'Influencer', 'Gamer']
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const t = translations[currentLang];

            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            document.getElementById('langText').textContent = t.langText;
            document.getElementById('visitsLabel').textContent = t.visitsLabel;
            document.getElementById('likesLabel').textContent = t.likesLabel;
            document.getElementById('channelsTitle').textContent = t.channelsTitle;
            document.getElementById('ytTitle').textContent = t.ytTitle;
            document.getElementById('ytDesc').textContent = t.ytDesc;
            document.getElementById('ttTitle').textContent = t.ttTitle;
            document.getElementById('ttDesc').textContent = t.ttDesc;
            document.getElementById('tgTitle').textContent = t.tgTitle;
            document.getElementById('tgDesc').textContent = t.tgDesc;
            document.getElementById('dcTitle').textContent = t.dcTitle;
            document.getElementById('dcDesc').textContent = t.dcDesc;
            document.getElementById('rbTitle').textContent = t.rbTitle;
            document.getElementById('rbDesc').textContent = t.rbDesc;
            document.getElementById('footerText').innerHTML = t.footerText;

            typingTexts = t.typingTexts;
            textIndex = 0;
            charIndex = 0;
            isDeleting = false;
        }

        let typingTexts = translations.ar.typingTexts;
        let textIndex = 0, charIndex = 0, isDeleting = false;
        const typingText = document.querySelector('.typing-text');

        function typeEffect() {
            const currentText = typingTexts[textIndex];
            if (isDeleting) {
                typingText.textContent = currentText.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typingText.textContent = currentText.substring(0, charIndex + 1);
                charIndex++;
            }
            let typeSpeed = isDeleting ? 50 : 100;
            if (!isDeleting && charIndex === currentText.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                textIndex = (textIndex + 1) % typingTexts.length;
                typeSpeed = 500;
            }
            setTimeout(typeEffect, typeSpeed);
        }

        function init() {
            handleVisits();
            handleLikes();
            typeEffect();
        }

        init();
    </script>
